# Blueprint de Render — Tótem Prevención Stracon (Web Service Node + Express)
# Docs: https://render.com/docs/blueprint-spec
#
# Importante: usar Web Service (runtime: node), NO Static Site.
# El proxy TTS vive en POST /api/tts del servidor Express.
#
# Deploy: Render Dashboard → New → Blueprint → repo inclusive-development/prevencionstracon
# Variables secretas (Environment): GOOGLE_TTS_API_KEY y VITE_GOOGLE_TTS_API_KEY

services:
  - type: web
    name: prevencionstracon
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GOOGLE_TTS_API_KEY
        sync: false
      # Build + fallback cliente (igual que tótem médico):
      - key: VITE_GOOGLE_TTS_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22.12.0"
